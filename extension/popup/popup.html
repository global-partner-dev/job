<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workana Radar AskBot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wb">
    <h1>🛰️ Workana Radar AskBot</h1>
    <p class="muted">
      Asking is controlled from the <b>Workana Radar</b> dashboard. Open it, sign in,
      and switch <b>Auto-ask</b> on — each new project opens here pre-filled for you
      to review and send.
    </p>
    <div id="status" class="status">Extension active. Waiting for the dashboard.</div>
    <div class="row">
      <h2>Recent activity</h2>
      <button id="clear" class="btn" type="button">Clear</button>
    </div>
    <div id="log" class="log"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
